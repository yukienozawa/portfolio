    id: context
    attributes:
      label: 質問の内容
      description: 何について知りたいですか？
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: 試したこと
      description: すでに自分で調べて試したこと、参考にしたURLなどがあれば書いてください。