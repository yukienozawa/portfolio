name: 🚀 機能要望・改善提案
description: 新しいアイデアや改善案を提案します
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 提案の背景
      description: なぜこの機能が必要だと思いましたか？解決したい課題を教えてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 具体的にどのような機能を想定していますか？
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に検討した方法があれば教えてください。